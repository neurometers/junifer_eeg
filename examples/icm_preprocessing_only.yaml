---
# ICM Preprocessing Only Configuration with Dumping
# Extracts only the preprocessing steps from icm_complete_individual_markers.yaml
# Enables dumping to validate against existing pkl data

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      pattern: "sub-JG318_ses-01_task-lg_acq-01_run-01_eeg.mff"
      space: "native"
  replacements: []
  types:
    - EEG
  datadir: "./ground_truth"

datareader:
  kind: ICMLGDataReader
  equipment: "egi/256"
  types:
    - EEG

preprocess:
  - kind: ICMEquipmentFilter
    equipment_type: "egi"
    dump_location: examples
    dump_granularity: full
    on: EEG
  - kind: ICMLGEpoching
    tmin: -0.2
    tmax: 1.34
    baseline: [-0.2, 0.0]
    event_id:
      "HSTD": 13  # High-density standard (52 events)
      "HDVT": 11  # High-density deviant (48 events) 
      "LSGS": 12  # Local standard global standard (208 events)
      "LSGD": 15  # Local standard global deviant (208 events)
      "LDGS": 18  # Local deviant global standard (208 events)
      "LDGD": 21  # Local deviant global deviant (208 events)
    dump_location: examples
    dump_granularity: full
    on: EEG
  - kind: ICMAdaptiveArtifactRejection
    zscore_thresh: 4.0
    min_channels: 0.7
    min_events: 0.3
    dump_location: examples
    dump_granularity: full
    on: EEG

# Minimal marker to complete pipeline (required by junifer)
markers:
  - kind: SpectralPower
    bands:
      delta: [1, 4]
    roi_aggregation_method: ["mean"]
    trial_aggregation_method: ["mean"]
    on: EEG

storage:
  kind: HDF5FeatureStorage
  uri: icm_preprocessing_test_results.h5
  single_output: true
