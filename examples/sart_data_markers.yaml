---
# Individual Markers Configuration - Replicating NicoPipelinePkl
# This YAML breaks down the NicoPipelinePkl marker into individual markers
# with exact same parameters and preprocessing as test_nico_pipeline.yaml

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: EEGDataGrabber
  patterns:
    EEG:
      pattern: "sub-06_task-Sart1_desc-state_epo.fif"
      space: "native"
  replacements: []
  types:
    - EEG
  datadir: "./raw/wetransfer_sub-06_task-sart1_desc-evoked_epo-json_2025-09-16_1537"

# No preprocessing needed - data is already preprocessed epochs
preprocess: []

storage:
  kind: HDF5FeatureStorage
  uri: test_nico_individual_markers.h5
  single_output: true
  

markers:
  # ========================================
  # 1. SPECTRAL ANALYSIS: Absolute Power (dB)
  # ========================================
  - kind: SpectralPower
    name: psd_bands
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 30.0]
      gamma: [30.0, 45.0]
    normalize: false
    dB: true
    n_fft: 2048
    n_overlap: 50
    n_per_seg: 256
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 2. SPECTRAL ANALYSIS: Relative Power (normalized)
  # ========================================
  - kind: SpectralPower
    name: psd_relative
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 30.0]
      gamma: [30.0, 45.0]
    normalize: true
    dB: false
    n_fft: 2048
    n_overlap: 50
    n_per_seg: 256
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 3. CONNECTIVITY: Symbolic Mutual Information (unweighted)
  # ========================================
  - kind: SymbolicMutualInformation
    name: smi
    tmin: null
    tmax: null
    kernel: 3
    tau: 8
    weighted: false
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 4. CONNECTIVITY: Weighted Symbolic Mutual Information
  # ========================================
  - kind: SymbolicMutualInformation
    name: wsmi
    tmin: null
    tmax: null
    kernel: 3
    tau: 8
    weighted: true
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 5. INFORMATION THEORY: Permutation Entropy
  # ========================================
  - kind: PermutationEntropy
    name: permutation_entropy
    kernel: 3
    tau: 8
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 6. INFORMATION THEORY: Kolmogorov Complexity
  # ========================================
  - kind: KolmogorovComplexity
    name: kolmogorov_complexity
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # ========================================
  # 7. TIME-LOCKED TOPOGRAPHIES: ERP Analysis
  # ========================================
  
  # Early component (P1-like, around 100ms)
  - kind: TimeLockedTopography
    name: erp_early_100ms
    tmin: 0.080
    tmax: 0.120
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # Mid component (N1-like, around 150ms)
  - kind: TimeLockedTopography
    name: erp_mid_150ms
    tmin: 0.130
    tmax: 0.170
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # Late component (P3-like, around 300ms)
  - kind: TimeLockedTopography
    name: erp_late_300ms
    tmin: 0.250
    tmax: 0.350
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG

  # Very late component (around 500ms)
  - kind: TimeLockedTopography
    name: erp_very_late_500ms
    tmin: 0.450
    tmax: 0.550
    channel_aggregation_method: null
    trial_aggregation_method: null
    on: EEG
