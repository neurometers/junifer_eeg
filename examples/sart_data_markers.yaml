---
# Individual Markers Configuration - Replicating NicoPipelinePkl
# This YAML breaks down the NicoPipelinePkl marker into individual markers
# with exact same parameters and preprocessing as test_nico_pipeline.yaml

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: EEGDataGrabber
  patterns:
    EEG:
      pattern: "sub-04_task-Sart1_desc-sleep_epo.fif"
      space: "native"
  replacements: []
  types:
    - EEG
  datadir: "site/bckp/nico/wetransfer_sub-04_task-sart1_desc-sleep_epo-fif_2025-11-24_1036/"

# No preprocessing needed - data is already preprocessed epochs
preprocess: []

storage:
  kind: HDF5FeatureStorage
  uri: output/test_nico_individual_markers.h5
  single_output: true
  

markers:


  # ========================================
  # SLEEP ANALYSIS MARKERS
  # ========================================
  

  # 1. Sleep Spindles Detection (Aggregated across channels)
  - kind: SpindlesDetection
    name: spindles_channel_agg
    freq_sp: [12, 15]           # Spindles frequency range (Hz)
    freq_broad: [1, 30]         # Broad band frequency range (Hz)
    duration: [0.5, 2.5]        # Min/max spindle duration (seconds)
    min_distance: 500           # Min distance between spindles (ms)
    thresh_rms: 1.5             # RMS threshold (SD above mean)
    thresh_corr: 0.65           # Correlation threshold
    reference_channels: ['TP7', 'TP8']  # Reference channels (default mastoids)
    channel_aggregation_method: "mean"  # Aggregate across channels
    on: EEG

  # 2. Sleep Spindles Detection (Raw events - per epoch, per channel)
  - kind: SpindlesDetection
    name: spindles_events
    freq_sp: [12, 15]           # Spindles frequency range (Hz)
    freq_broad: [1, 30]         # Broad band frequency range (Hz)
    duration: [0.5, 2.5]        # Min/max spindle duration (seconds)
    min_distance: 500           # Min distance between spindles (ms)
    thresh_rms: 1.5             # RMS threshold (SD above mean)
    thresh_corr: 0.65           # Correlation threshold
    reference_channels: ['TP7', 'TP8']  # Reference channels (default mastoids)
    # No aggregation - returns all events with Epoch and Channel info
    on: EEG

  # 3. Slow Waves Detection (Aggregated across channels)
  - kind: SlowWavesDetection
    name: slowwaves_channel_agg
    freq_sw: [0.3, 1.5]         # Slow waves frequency range (Hz)
    amp_ptp_initial: 15.0       # Initial PTP threshold (µV)
    freq_threshold: 7.0         # Max frequency threshold (Hz)
    artifact_threshold: 75.0    # Max positive peak threshold (µV)
    reference_channels: ['TP7', 'TP8']  # Reference channels (default mastoids)
    channel_aggregation_method: "mean"  # Aggregate across channels
    on: EEG

  # 4. Slow Waves Detection (Raw events - per epoch, per channel)
  - kind: SlowWavesDetection
    name: slowwaves_events
    freq_sw: [0.3, 1.5]         # Slow waves frequency range (Hz)
    amp_ptp_initial: 15.0       # Initial PTP threshold (µV)
    freq_threshold: 7.0         # Max frequency threshold (Hz)
    artifact_threshold: 75.0    # Max positive peak threshold (µV)
    reference_channels: ['TP7', 'TP8']  # Reference channels (default mastoids)
    # No aggregation - returns all events with Epoch and Channel info
    on: EEG


