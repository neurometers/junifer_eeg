# Real EEG Data Pipeline
# Works directly with .fif epoch files from real EEG studies
# Just update the datadir path to point to your EEG data folder

with:
  - "junifer_eeg"

workdir: "./results"

# Pattern-based data grabber that matches real .fif files
datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      pattern: "{subject}_ses-{session}_task-{task}_acq-{acquisition}_epo.fif"
      space: "native"
  replacements:
    - subject
    - session  
    - task
    - acquisition
  types:
    - EEG
  datadir: "./eeg"  # Point this to your EEG data folder

# Read EEG epochs directly using our custom EEG reader
datareader:
  kind: EEGDataReader
  types:
    - EEG

# Basic preprocessing
preprocess:
  - kind: EEGFilter
    low_freq: 1.0
    high_freq: 40.0
    on: EEG

# Markers with proper ROI and trial aggregation
markers:
  # Spectral power across key brain regions using proper ROI names
  - name: SpectralPower_Frontal
    kind: SpectralPower
    rois: ["F", "FC"]  # Frontal (F3,F4,F7,F8) + Frontal-Central (FC1,FC2,FC5,FC6)
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    on: EEG

  - name: SpectralPower_Central  
    kind: SpectralPower
    rois: ["C", "CP"]  # Central (C3,C4) + Central-Parietal (CP1,CP2,CP5,CP6)
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    on: EEG

  - name: SpectralPower_Parietal
    kind: SpectralPower
    rois: ["P", "PO"]  # Parietal (P3,P4,P7,P8) + Parieto-Occipital (PO3,PO4,PO7,PO8)
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    on: EEG

  # Complexity measures for key clinical regions
  - name: PermEntropy_CNV_Region
    kind: PermutationEntropy
    kernel: 3
    tau: 8
    rois: ["cnv"]  # CNV-specific electrodes for clinical analysis
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    on: EEG

  # For local-global task analysis - clinical ROIs
  - name: LocalGlobal_MMN_Contrast
    kind: TimeLockedContrast
    condition_a: ["10", "30", "50"]  # Based on real event codes
    condition_b: ["20", "40", "60"]  # Based on real event codes
    tmin: 0.1
    tmax: 0.5
    rois: ["mmn"]  # MMN-specific electrodes
    roi_aggregation_method: [mean]
    comment: "MMN_contrast"
    on: EEG

  - name: LocalGlobal_P3_Decoding
    kind: WindowDecoding
    condition_a: ["10", "30", "50"]  # Based on real event codes
    condition_b: ["20", "40", "60"]  # Based on real event codes
    tmin: 0.3
    tmax: 0.6
    rois: ["p3b"]  # P3b-specific electrodes for decoding
    roi_aggregation_method: [mean]
    n_splits: 3
    scoring: roc_auc
    random_state: 42
    comment: "P3_decoding"
    on: EEG

# Save results
storage:
  kind: HDF5FeatureStorage
  uri: "real_eeg_results.h5"

# Define which data to process
elements:
  - subject: "sub-AA048"
    session: "01"
    task: "rs"
    acquisition: "01"
  - subject: "sub-AA048"
    session: "01" 
    task: "lg"
    acquisition: "01" 