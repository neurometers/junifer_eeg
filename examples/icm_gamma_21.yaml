with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: ICMLGDataGrabber
  equipment_type: "edf"  # Triggers ICMLGDataReader with EDF annotation mapping
  patterns:
    EEG:
      pattern: "test_gamma21.edf"
      space: "native"
  replacements: []
  types:
    - EEG
  datadir: "/home/gio/Documents/Repos/junifer_eeg/site/bckp/ground_truth"

preprocess:
  # No EEGCropper needed - epoching automatically selects only valid LG events
  # Unmapped MARQUEUR codes (calibration, etc.) are automatically ignored
  - kind: ICMEquipmentFilter
    equipment_type: "egi"
    dump_location: examples
    dump_granularity: full
    on: EEG
  - kind: ICMLGEpoching
    tmin: -0.2
    tmax: 1.34
    baseline: [-0.2, 0.0]
    # event_id can be omitted - will auto-detect all ICM conditions from annotations
    # ICMLGDataReader maps: MARQUEUR 65,97→HSTD, 73,105→HDVT, 129,161→LSGS, etc.  
    dump_location: examples
    dump_granularity: full
    on: EEG
  - kind: ICMAdaptiveArtifactRejection
    zscore_thresh: 4.0
    min_channels: 0.5
    min_events: 0.1
    interpolate_bads: false  # Disable interpolation for EDF files with imperfect montage matching
    dump_location: examples
    dump_granularity: full
    on: EEG

markers: []

storage:
  kind: HDF5FeatureStorage
  uri: examples/icm_gamma_21_features.h5
