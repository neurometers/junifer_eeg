# ICM Local-Global Preprocessing Example
# This configuration implements the 4-step adaptive artifact rejection pipeline
# matching the _adaptive_egi function from NICE:
#   1. BadChannelsThreshold - Find bad channels by threshold
#   2. BadChannelsVariance - Find bad channels by variance z-scoring
#   3. BadEpochsThreshold - Find bad epochs by threshold
#   4. BadChannelsHighFrequency - Find bad channels by high-frequency variance

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: EEGDataGrabber
  patterns:
    EEG:
      pattern: "sub-PA301/eeg_raw/sub-PA301_ses-01_task-lg_acq-01_run-01_eeg.mff"
      space: "native"
  replacements: []
  types:
    - EEG
  datadir: "/home/gio/Documents/Repos/junifer_eeg/site/bckp/ground_truth/"

preprocess:
  # Step 1: Filter and Resample
  # Exact parameters matching the specification
  - kind: EEGFilter
    low_freq: 45.0        # Low-pass cutoff (h_freq in MNE)
    high_freq: 0.5        # High-pass cutoff (l_freq in MNE)
    notches: [50, 100]    # Line frequencies
    resample_freq: 250    # Downsample to 250 Hz
    hp_order: 6           # High-pass filter order
    lp_order: 8           # Low-pass filter order
    l_trans_bandwidth: 0.1
    filter_method: "iir"
    n_jobs: 1
    dump_path: output/preprocess/01_filtered_eeg
    on: EEG

  # Step 2: Create Epochs
  # Exact event codes matching the specification
  - kind: EEGEpoching
    tmin: -0.2
    tmax: 1.34
    baseline: [-0.2, 0.0]
    event_id:
      "HSTD": 12   # High Standard
      "HDVT": 15   # High Deviant
      "LSGS": 18   # Low Standard Global Standard
      "LSGD": 21   # Low Standard Global Deviant
      "LDGS": 13   # Low Deviant Global Standard
      "LDGD": 16   # Low Deviant Global Deviant
    dump_path: output/preprocess/02_epoched_eeg
    on: EEG

  # Step 3: Adaptive Artifact Rejection (4 steps from _adaptive_egi)
  
  # 3a. Bad Channels - Threshold
  # Exact parameters matching the specification
  - kind: BadChannelsThreshold
    reject:
      eeg: 100.0e-6   # 100 µV threshold
    n_epochs_bad_ch: 0.5
    min_channels: 0.7
    interpolate: false  # Don't interpolate yet - defer until after all detection
    on: EEG

  # 3b. Bad Channels - Variance
  # Exact parameters matching the specification
  - kind: BadChannelsVariance
    zscore_thresh: 4.0
    max_iter: 4
    min_channels: 0.7
    interpolate: false  # Don't interpolate yet
    on: EEG

  # 3c. Bad Epochs - Threshold
  # Exact parameters matching the specification
  - kind: BadEpochsThreshold
    reject:
      eeg: 100.0e-6   # 100 µV threshold
    n_channels_bad_epoch: 0.1
    min_events: 0.1
    drop_bad_epochs: true
    on: EEG

  # 3d. Bad Channels - High Frequency
  # Exact parameters matching the specification
  - kind: BadChannelsHighFrequency
    zscore_thresh: 4.0
    max_iter: 4
    min_channels: 0.5
    interpolate: false  # Detection ONLY - interpolation later
    on: EEG

  # Step 4: Average Reference
  - kind: EEGReference
    ref_channels: "average"
    projection: true
    on: EEG

  # Step 5: Interpolate Bad Channels
  # Interpolate all detected bad channels after referencing
  - kind: EEGInterpolation
    method:
      eeg: "spline"
    reset_bads: true
    origin: "auto"
    dump_path: output/preprocess/03_clean_eeg
    on: EEG

markers: []

storage:
  kind: HDF5FeatureStorage
  uri: output/preprocessing_results.h5
  single_output: true

