---
# Comprehensive marker test - verifies reader correctly identifies marker types
# from HDF5 metadata (marker['class']) WITHOUT relying on marker names

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: EEGDataGrabber
  patterns:
    EEG:
      pattern: "{subject}_task-Sart1_desc-evoked_epo.fif"
      space: "native"
  replacements: ["subject"]
  types:
    - EEG
  datadir: "/home/gio/Documents/Repos/junifer_eeg/site/bckp/nico/data"

preprocess: []

storage:
  kind: HDF5FeatureStorage
  uri: output/comprehensive_marker_test.h5
  single_output: true

markers:


  - kind: SymbolicMutualInformation
    name: another_weird_name_multi_tau  # Multi-tau WSMI
    kernel: 3
    taus: [8, 4, 2, 1]
    weighted: true
    csd: false
    tmax: 0.5
    "on": "EEG"

  # ============================================
  # Spectral Power - named "bazqux" to prove class detection
  # ============================================
  - kind: SpectralPowerBands
    name: bazqux_power_multi_band  # NOT "psd" or "spectral"
    bands:
      theta: [4, 8]
      alpha: [8, 13]
      beta: [13, 30]
    tmin: null
    tmax: 0.5
    "on": "EEG"
