---
# Simple EEG Pipeline Configuration for beginners
# Extracts basic spectral features from EEG data
#
# Usage:
#   junifer run simple_eeg_pipeline.yaml
#
# Data requirements:
#   - EDF files in data directory named: subject1_eeg.edf, subject2_eeg.edf, etc.

# Load the junifer_eeg extension
with:
  - "junifer_eeg"

# Set working directory
workdir: "."

# Find EEG data files
datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      pattern: "{subject}_eeg.edf"
      space: "native"
  replacements:
    - subject
  types:
    - EEG
  datadir: "./test_data"  # Update this to your data directory

# Read EEG data
datareader:
  kind: DefaultDataReader
  types:
    - EEG

# Basic preprocessing
preprocess:
  - kind: EEGFilter
    low_freq: 1.0    # High-pass filter at 1 Hz
    high_freq: 40.0  # Low-pass filter at 40 Hz
    on: EEG

# Extract basic features
markers:
  # Spectral power in standard EEG frequency bands
  # (uses predefined delta, theta, alpha, beta bands)
  - kind: SpectralPower
    on: EEG

  # Signal complexity measure
  - kind: KolmogorovComplexity
    nbins: 16
    on: EEG

# Save results to HDF5 format (recommended modern format)
storage:
  kind: HDF5FeatureStorage
  uri: "eeg_basic_features.hdf5"

# Process these subjects
elements:
  - subject: "subject1" 