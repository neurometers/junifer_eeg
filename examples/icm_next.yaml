---
# ICM Local-Global Pipeline Configuration matching next_icm exactly
# Complete LG paradigm with exact hyperparameters from next_icm
# Data: sample_raw_child.fif
# Based on next_icm/lg/markers.py and next_icm/rs/markers.py

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      pattern: "sample_raw_child.fif"
      space: "native"
  replacements: []  # Empty list since no pattern variables used
  types:
    - EEG
  datadir: "./raw"

datareader:
  kind: ICMLGDataReader
  equipment: "standard"
  types:
    - EEG

preprocess:
  - kind: ICMEquipmentFilter
    equipment_type: "standard"
    on: EEG
  - kind: ICMLGEpoching
    tmin: -0.2
    tmax: 1.34
    baseline: [-0.2, 0.0]
    reject_criteria: {"eeg": 200e-6}
    event_id: "auto"
    on: EEG
  - kind: ICMAdaptiveArtifactRejection
    z_threshold: 4.0
    max_bad_channels: 0.1
    max_bad_epochs: 0.2
    on: EEG

storage:
  kind: HDF5FeatureStorage
  uri: icm_lg_features.hdf5
  single_output: true

# COMPLETE NEXT_ICM LG MARKER SET (30 markers total)
# 17 resting state markers + 13 LG-specific markers
markers:
  # ===================================================================
  # RESTING STATE MARKERS (17 markers) - from next_icm/rs/markers.py
  # ===================================================================
  
  # Power Spectral Density markers (11 markers) - EXACT next_icm parameters
  # Using SpectralPower with NICE-compatible parameters
  
  # Delta band (1-4 Hz) - absolute power
  - kind: SpectralPower
    name: psd_delta
    fmin: 1.0
    fmax: 4.0
    normalize: false
    dB: true                                    # NICE uses dB conversion
    n_fft: 4096                                 # NICE parameter
    n_overlap: 100                              # NICE parameter
    n_per_seg: 128                              # NICE parameter
    roi_aggregation_method: ["trim_mean80"]     # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Delta band (1-4 Hz) - relative power
  - kind: SpectralPower
    name: psd_deltan
    fmin: 1.0
    fmax: 4.0
    normalize: true
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Theta band (4-8 Hz) - absolute power
  - kind: SpectralPower
    name: psd_theta
    fmin: 4.0
    fmax: 8.0
    normalize: false
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Theta band (4-8 Hz) - relative power
  - kind: SpectralPower
    name: psd_thetan
    fmin: 4.0
    fmax: 8.0
    normalize: true
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Alpha band (8-12 Hz) - absolute power
  - kind: SpectralPower
    name: psd_alpha
    fmin: 8.0
    fmax: 12.0
    normalize: false
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Alpha band (8-12 Hz) - relative power
  - kind: SpectralPower
    name: psd_alphan
    fmin: 8.0
    fmax: 12.0
    normalize: true
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Beta band (12-30 Hz) - absolute power
  - kind: SpectralPower
    name: psd_beta
    fmin: 12.0
    fmax: 30.0
    normalize: false
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Beta band (12-30 Hz) - relative power
  - kind: SpectralPower
    name: psd_betan
    fmin: 12.0
    fmax: 30.0
    normalize: true
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Gamma band (30-45 Hz) - absolute power
  - kind: SpectralPower
    name: psd_gamma
    fmin: 30.0
    fmax: 45.0
    normalize: false
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Gamma band (30-45 Hz) - relative power
  - kind: SpectralPower
    name: psd_gamman
    fmin: 30.0
    fmax: 45.0
    normalize: true
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Summary spectral edge - all bands
  - kind: SpectralPower
    name: psd_summary_se
    fmin: 1.0
    fmax: 45.0
    normalize: true
    dB: true
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG

  # PSD Summary markers (3 markers) - EXACT next_icm parameters
  # Median spectral frequency (50th percentile)
  - kind: PowerSpectralDensitySummary
    name: psd_summary_msf
    fmin: 1.0
    fmax: 45.0
    percentile: 50.0
    n_fft: 4096                                 # NICE parameter
    n_overlap: 100                              # NICE parameter
    n_per_seg: 128                              # NICE parameter
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Spectral edge frequency 90%
  - kind: PowerSpectralDensitySummary
    name: psd_summary_sef90
    fmin: 1.0
    fmax: 45.0
    percentile: 90.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Spectral edge frequency 95%
  - kind: PowerSpectralDensitySummary
    name: psd_summary_sef95
    fmin: 1.0
    fmax: 45.0
    percentile: 95.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Information Theory markers (3 markers) - EXACT next_icm parameters
  # Permutation entropy - NICE backend='c' parameter
  - kind: PermutationEntropy
    name: permutation_entropy
    kernel: 3                                   # NICE default
    tau: 1                                      # NICE default
    roi_aggregation_method: ["trim_mean80"]     # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Symbolic mutual information - NICE weighted method with openmp backend
  - kind: SymbolicMutualInformation
    name: symbolicmutualinformation
    kernel: 3                                   # NICE default
    tau: 8                                      # NICE default
    weighted: true                              # NICE method='weighted'
    roi_aggregation_method: ["trim_mean80"]     # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG
    
  # Kolmogorov complexity - NICE openmp backend
  - kind: KolmogorovComplexity
    name: kolmogorov_complexity
    nbins: 16                                   # NICE default
    roi_aggregation_method: ["trim_mean80"]     # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  # ===================================================================
  # LG-SPECIFIC MARKERS (13 markers) - from next_icm/lg/markers.py
  # ===================================================================
  
  # 1. Contingent Negative Variation (CNV) - preparatory slow wave
  - kind: ContingentNegativeVariation
    name: cnv_slopes
    tmin: -0.004                              # EXACT next_icm parameter
    tmax: 0.596                               # EXACT next_icm parameter
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  # 2-4. Time-locked topographies (3 markers: P1, P3a, P3b)
  - kind: TimeLockedTopography
    name: time_locked_topo_p1
    tmin: 0.064                               # EXACT next_icm parameter
    tmax: 0.112                               # EXACT next_icm parameter
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedTopography  
    name: time_locked_topo_p3a
    tmin: 0.876                               # EXACT next_icm parameter
    tmax: 0.936                               # EXACT next_icm parameter
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedTopography
    name: time_locked_topo_p3b
    tmin: 0.996                               # EXACT next_icm parameter
    tmax: 1.196                               # EXACT next_icm parameter
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  # 5-11. Time-locked contrasts (7 markers) - EXACT next_icm parameters
  - kind: TimeLockedContrast
    name: contrast_lsgs_ldgd
    tmin: null                                # EXACT next_icm parameter
    tmax: null                                # EXACT next_icm parameter
    condition_a: "LSGS"                       # Local Same Global Same
    condition_b: "LDGD"                       # Local Different Global Different
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedContrast
    name: contrast_lsgd_ldgs
    tmin: null                                # EXACT next_icm parameter
    tmax: null                                # EXACT next_icm parameter
    condition_a: "LSGD"                       # Local Same Global Different
    condition_b: "LDGS"                       # Local Different Global Same
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedContrast
    name: contrast_ld_ls
    tmin: null                                # EXACT next_icm parameter
    tmax: null                                # EXACT next_icm parameter
    condition_a: ["LDGS", "LDGD"]             # Local Different conditions
    condition_b: ["LSGS", "LSGD"]             # Local Same conditions
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedContrast
    name: contrast_mmn
    tmin: 0.736                               # EXACT next_icm parameter
    tmax: 0.788                               # EXACT next_icm parameter
    condition_a: ["LDGS", "LDGD"]             # Local Different (deviant)
    condition_b: ["LSGS", "LSGD"]             # Local Same (standard)
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedContrast
    name: contrast_p3a
    tmin: 0.876                               # EXACT next_icm parameter
    tmax: 0.936                               # EXACT next_icm parameter
    condition_a: ["LDGS", "LDGD"]             # Local Different conditions
    condition_b: ["LSGS", "LSGD"]             # Local Same conditions
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedContrast
    name: contrast_gd_gs
    tmin: null                                # EXACT next_icm parameter
    tmax: null                                # EXACT next_icm parameter
    condition_a: ["LSGD", "LDGD"]             # Global Different conditions
    condition_b: ["LSGS", "LDGS"]             # Global Same conditions
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedContrast
    name: contrast_p3b
    tmin: 0.996                               # EXACT next_icm parameter
    tmax: 1.196                               # EXACT next_icm parameter
    condition_a: ["LSGD", "LDGD"]             # Global Different (deviant)
    condition_b: ["LSGS", "LDGS"]             # Global Same (standard)
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  # 12-13. Window decoding markers (2 markers) - EXACT next_icm parameters
  - kind: WindowDecoding
    name: window_decoding_local
    tmin: 0.6                                 # EXACT next_icm parameter
    tmax: 0.967                               # EXACT next_icm parameter
    condition_a: ["LDGS", "LDGD"]             # Local Different
    condition_b: ["LSGS", "LSGD"]             # Local Same
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: WindowDecoding
    name: window_decoding_global
    tmin: 0.967                               # EXACT next_icm parameter
    tmax: 1.336                               # EXACT next_icm parameter
    condition_a: ["LSGD", "LDGD"]             # Global Different
    condition_b: ["LSGS", "LDGS"]             # Global Same
    roi_aggregation_method: ["trim_mean80"]   # NICE reduction method
    trial_aggregation_method: ["mean"]
    on: EEG 