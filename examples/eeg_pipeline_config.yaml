---
# Example EEG Pipeline Configuration for junifer_eeg extension
# This configuration can be run from command line without Python coding
#
# Usage:
#   junifer run eeg_pipeline_config.yaml
#
# Requirements:
#   - EDF files named as {subject}_eeg.edf in data directory
#   - junifer_eeg extension installed

# Specify which extension to load
with:
  - "junifer_eeg"

# Set working directory
workdir: "."

# Configure where to find the data
datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      pattern: "{subject}_eeg.edf"
      space: "native"
  replacements:
    - subject
  types:
    - EEG
  datadir: "/path/to/your/eeg/data"  # Update this path

# Configure how to read the data
datareader:
  kind: DefaultDataReader
  types:
    - EEG

# Define preprocessing steps
preprocess:
  # Filter EEG data
  - kind: EEGFilter
    low_freq: 1.0
    high_freq: 40.0
    on: EEG

# Define feature extraction markers
markers:
  # Basic spectral power in frequency bands
  # (uses predefined delta, theta, alpha, beta bands)
  - kind: SpectralPower
    on: EEG

  # Kolmogorov Complexity (algorithmic complexity)
  - kind: KolmogorovComplexity
    nbins: 16
    on: EEG

  # Permutation Entropy (temporal complexity)
  - kind: PermutationEntropy
    kernel: 3
    tau: 1
    on: EEG

  # Contingent Negative Variation (event-related potential)
  - kind: ContingentNegativeVariation
    on: EEG

  # Power Spectral Density features
  - kind: PowerSpectralDensityEstimator
    fmin: 1.0
    fmax: 40.0
    n_fft: 512
    on: EEG

  # PSD Summary statistics
  - kind: PowerSpectralDensitySummary
    fmin: 1.0
    fmax: 40.0
    percentile: 50.0
    on: EEG

  # Time-locked topography analysis
  - kind: TimeLockedTopography
    tmin: -0.2
    tmax: 0.5
    on: EEG

  # Time decoding analysis
  - kind: TimeDecoding
    tmin: -0.1
    tmax: 0.3
    epoch_length: 1.0
    condition_method: "temporal_halves"
    n_splits: 3
    on: EEG

# Configure where to save results  
storage:
  kind: HDF5FeatureStorage
  uri: "eeg_features.hdf5"

# Define the subjects to process
elements:
  - subject: "subject1"
  - subject: "subject2"
  - subject: "subject3" 