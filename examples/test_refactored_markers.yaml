---
# Test Refactored Markers - SpectralPower and PermutationEntropy
# This YAML tests the new hierarchical markers against the same data

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: EEGDataGrabber
  patterns:
    EEG:
      pattern: "sub-PA301/epochs/sub-PA301_ses-01_task-lg_acq-01_epo.fif"
      space: "native"
  replacements: []
  types:
    - EEG
  datadir: "/home/gio/Documents/Repos/junifer_eeg/site/bckp/ground_truth"

preprocess: []

storage:
  kind: HDF5FeatureStorage
  uri: output/test_refactored_markers.h5
  single_output: true

markers:

  # ========================================
  # NEW: SpectralPowerBandsROIs (replaces multiple SpectralPower calls)
  # ========================================
  
  # Single marker computes all bands with aggregation
  - kind: SpectralPowerBands
    name: spectral_all_bands
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 30.0]
      gamma: [30.0, 45.0]
    normalize: false
    dB: true
    db_threshold: 1.0e-12
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    rois: null  # No ROI filtering - keep all channels
    channel_method: null  # No channel aggregation
    trial_method: "trim_mean"  # Average across trials (trim_mean80 = proportiontocut=0.1)
    trial_method_params:
      proportiontocut: 0.1
    on: EEG

  # ========================================
  # NEW: PermutationEntropyROIs
  # ========================================
  
  # Single marker computes all bands with aggregation
  - kind: PermutationEntropy
    name: pe_all_bands
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 30.0]
      gamma: [30.0, 45.0]
    kernel: 3
    tau: 8
    filter_order: 6
    tmin: 0.0
    tmax: 0.6
    rois: null
    channel_method: null
    trial_method: "mean"
    on: EEG

  # ========================================
  # NEW: SymbolicMutualInformationROIs
  # ========================================
  
  # SMI connectivity with aggregation
  - kind: SymbolicMutualInformationROIs
    name: smi_weighted
    kernel: 3
    tau: 8
    weighted: true
    csd: true
    tmin: 0.0
    tmax: 0.6
    connectivity_method: "median"  # Aggregate across channel_y
    channel_method: "mean"  # Aggregate across channel_x
    trial_method: "mean"  # Aggregate across epochs
    on: EEG
