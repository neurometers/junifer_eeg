---
# ICM Preprocessing Only Configuration (Docker Manual Run Version)
# This version uses explicit /app/ paths for manual docker run commands
# 
# Usage with manual docker run:
#   docker run --rm \
#     --user $(id -u):$(id -g) \
#     -v $(pwd)/examples/icm_preprocessing_only_docker.yaml:/app/config.yaml \
#     -v $(pwd)/site/bckp/ground_truth:/app/data \
#     -v $(pwd)/output:/app/output \
#     -v $(pwd)/.docker_cache:/cache \
#     -e HOME=/cache \
#     -e TEMPLATEFLOW_HOME=/cache/templateflow \
#     junifer-eeg:latest run /app/config.yaml

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: ICMLGDataGrabber
  patterns:
    EEG:
      pattern: "sub-PA301/eeg_raw/sub-PA301_ses-01_task-lg_acq-01_run-01_eeg.mff"
      space: "native"
  replacements: []
  types:
    - EEG
  equipment_type: "egi"
  datadir: "/app/data"

preprocess:
  - kind: ICMEquipmentFilter
    equipment_type: "egi"
    dump_location: /app/output
    dump_granularity: full
    on: EEG
  - kind: ICMLGEpoching
    tmin: -0.2
    tmax: 1.34
    baseline: [-0.2, 0.0]
    event_id:
      "HSTD": 10  
      "HDVT": 20  
      "LSGS": 30  
      "LSGD": 40  
      "LDGD": 50  
      "LDGS": 60  
    dump_location: /app/output
    dump_granularity: full
    on: EEG
  - kind: ICMAdaptiveArtifactRejection
    zscore_thresh: 4.0
    min_channels: 0.5
    min_events: 0.1
    dump_location: /app/output
    dump_granularity: full
    on: EEG

# No markers for preprocessing-only test
markers: []

storage:
  kind: HDF5FeatureStorage
  uri: /app/output/icm_preprocessing_test_results.h5
  single_output: true

