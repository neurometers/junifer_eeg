# EEG Analysis Pipeline Configuration
# Following junifer's standard pattern

workdir: .

# Import the junifer_eeg extension to register all components
with:
  - junifer_eeg

# Configure the data grabber using junifer's PatternDataGrabber
datagrabber:
  kind: PatternDataGrabber
  datadir: data
  patterns:
    EEG:
      pattern: "{subject}_eeg.edf"
      space: "native"
  replacements:
    - subject
  types:
    - EEG

# Define the subjects to process
elements:
  - subject1
  - subject2

# Configure preprocessing
preprocess:
  - kind: EEGFilter
    low_freq: 1.0
    high_freq: 40.0
    on: EEG

# Configure the markers to compute
markers:
  - name: spectral_power_analysis
    kind: SpectralPower
    on: EEG

# Configure storage using HDF5 (not deprecated SQLite)
storage:
  kind: HDF5FeatureStorage
  uri: eeg_results.hdf5

# Optional: Queue configuration for HTCondor (following Fede's pattern)
queue:
  jobname: eeg_spectral_power_analysis
  kind: HTCondor
  env:
    kind: conda
    name: junifer_dev
  mem: 8G
  cpus: 1
  disk: 5G
  verbose: info
  collect: yes 