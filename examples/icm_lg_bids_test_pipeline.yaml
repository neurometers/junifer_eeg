# ICM Local Global Complete Pipeline for BIDS EEG Data Testing
# This pipeline tests all the new markers with realistic BIDS data

# Import the BIDS EEG data grabber
with:
  - junifer_eeg.tests.test_icm_lg_full_pipeline

workdir: /tmp/junifer_icm_lg_test

datagrabber:
  kind: BIDSEEGDataGrabber
  datadir: /home/gio/Documents/Repos/junifer_eeg/junifer_eeg/tests/test_data/icm_lg_bids

datareader:
  kind: EEGDataReader
  events_suffix: events

preprocess:
  - kind: EEGFilter
    l_freq: 1.0
    h_freq: 40.0
    method: fir

markers:
  # CNV Analysis
  - name: CNV_all_conditions
    kind: ContingentNegativeVariation
    conditions: ["LSGS", "LDGD", "LSGD", "LDGS"]
    tmin: -0.004
    tmax: 0.596
    roi_aggregation_method: [mean, std]
    trial_aggregation_method: [mean]

  # Evoked Topographies
  - name: P1_component
    kind: TimeLockedTopography
    tmin: 0.064
    tmax: 0.112
    trial_aggregation_method: [mean]

  - name: P3a_component  
    kind: TimeLockedTopography
    tmin: 0.876
    tmax: 0.936
    trial_aggregation_method: [mean]

  - name: P3b_component
    kind: TimeLockedTopography
    tmin: 0.996
    tmax: 1.196
    trial_aggregation_method: [mean]

  # Condition Contrasts
  - name: MMN_contrast
    kind: TimeLockedContrast
    condition_a: [LSGS]
    condition_b: [LDGD]
    tmin: 0.736
    tmax: 0.788
    comment: MMN
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    equipment: standard

  - name: P3a_contrast
    kind: TimeLockedContrast  
    condition_a: [LSGS]
    condition_b: [LDGD]
    tmin: 0.876
    tmax: 0.936
    comment: P3a
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    equipment: standard

  - name: P3b_contrast
    kind: TimeLockedContrast
    condition_a: [LSGD] 
    condition_b: [LDGS]
    tmin: 0.996
    tmax: 1.196
    comment: P3b
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    equipment: standard

  - name: Local_vs_Standard
    kind: TimeLockedContrast
    condition_a: [LDGS, LDGD]
    condition_b: [LSGS, LSGD] 
    tmin: 0.6
    tmax: 0.967
    comment: Local_effect
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    equipment: standard

  - name: Global_vs_Standard
    kind: TimeLockedContrast
    condition_a: [LSGD, LDGD]
    condition_b: [LSGS, LDGS]
    tmin: 0.967
    tmax: 1.336
    comment: Global_effect
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    equipment: standard

  # Decoding Analysis
  - name: Local_decoding
    kind: WindowDecoding
    condition_a: [LDGS, LDGD]
    condition_b: [LSGS, LSGD]
    tmin: 0.6
    tmax: 0.967
    n_splits: 3
    scoring: roc_auc
    random_state: 42
    comment: Local_classification
    equipment: standard

  - name: Global_decoding
    kind: WindowDecoding
    condition_a: [LSGD, LDGD]
    condition_b: [LSGS, LDGS]
    tmin: 0.967
    tmax: 1.336
    n_splits: 3
    scoring: roc_auc
    random_state: 42
    comment: Global_classification
    equipment: standard

  # Spectral Analysis
  - name: Delta_power
    kind: SpectralPower
    fmin: 1
    fmax: 4
    tmin: 0.0
    tmax: 1.0
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]

  - name: Theta_power
    kind: SpectralPower
    fmin: 4
    fmax: 8
    tmin: 0.0
    tmax: 1.0
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]

  - name: Alpha_power
    kind: SpectralPower
    fmin: 8
    fmax: 12
    tmin: 0.0
    tmax: 1.0
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]

  - name: Beta_power
    kind: SpectralPower
    fmin: 12
    fmax: 30
    tmin: 0.0
    tmax: 1.0
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]

  - name: Gamma_power
    kind: SpectralPower
    fmin: 30
    fmax: 40
    tmin: 0.0
    tmax: 1.0
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]

  # Information Theory Markers
  - name: Permutation_entropy
    kind: PermutationEntropy
    tmin: 0.0
    tmax: 1.0
    kernel: 3
    tau: 8
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    epoch_length: 2.0
    overlap: 0.0
    on: EEG

  - name: Kolmogorov_complexity
    kind: KolmogorovComplexity
    tmin: 0.0
    tmax: 1.0
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean]
    epoch_length: 2.0
    overlap: 0.0
    on: EEG

  # Connectivity Analysis
  - name: Symbolic_MI
    kind: SymbolicMutualInformation
    tmin: 0.0
    tmax: 1.0
    kernel: 3
    tau: 8
    weighted: true
    equipment: standard

storage:
  kind: HDF5FeatureStorage
  uri: icm_lg_features_test.h5 