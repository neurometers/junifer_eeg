---
# ICM Child ERP Analysis Configuration
# Uses sample_raw_child.fif with EXACT same hyperparameters as icm_next.yaml
# Includes data extraction for ERP visualization and quality assessment

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: PatternDataGrabber
  patterns:
    EEG:
      pattern: "sample_raw_child.fif"
      space: "native"
  replacements: []
  types:
    - EEG
  datadir: "./raw"

datareader:
  kind: ICMLGDataReader
  equipment: "standard"
  types:
    - EEG

preprocess:
  - kind: ICMEquipmentFilter
    equipment_type: "standard"
    on: EEG
  - kind: ICMLGEpoching
    tmin: -0.2
    tmax: 1.34
    baseline: [-0.2, 0.0]
    reject_criteria: {"eeg": 200e-6}
    event_id: "auto"
    on: EEG
  - kind: ICMAdaptiveArtifactRejection
    z_threshold: 4.0
    max_bad_channels: 0.1
    max_bad_epochs: 0.2
    on: EEG

storage:
  kind: HDF5FeatureStorage
  uri: icm_child_erp_features.hdf5
  single_output: true

markers:
  # DATA EXTRACTION MARKER - Save intermediate data for ERP visualization
  - kind: ICMReportDataExtractor
    name: data_extractor
    save_intermediate: true
    output_dir: "./icm_child_erp_data"
    baseline: [-0.2, 0.0]
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG

  # MINIMAL MARKERS FOR ERP ANALYSIS - EXACT icm_next.yaml hyperparameters
  
  # Time-locked topographies for ERP components
  - kind: TimeLockedTopography
    name: time_locked_topo_p1
    tmin: 0.064                               # EXACT icm_next parameter
    tmax: 0.112                               # EXACT icm_next parameter
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedTopography  
    name: time_locked_topo_p3a
    tmin: 0.876                               # EXACT icm_next parameter
    tmax: 0.936                               # EXACT icm_next parameter
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedTopography
    name: time_locked_topo_p3b
    tmin: 0.996                               # EXACT icm_next parameter
    tmax: 1.196                               # EXACT icm_next parameter
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG

  # CNV component
  - kind: ContingentNegativeVariation
    name: cnv_slopes
    tmin: -0.004                              # EXACT icm_next parameter
    tmax: 0.596                               # EXACT icm_next parameter
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG

  # Key contrasts for ERP quality assessment
  - kind: TimeLockedContrast
    name: contrast_mmn
    tmin: 0.736                               # EXACT icm_next parameter
    tmax: 0.788                               # EXACT icm_next parameter
    condition_a: ["LDGS", "LDGD"]             # Local Different (deviant)
    condition_b: ["LSGS", "LSGD"]             # Local Same (standard)
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG

  - kind: TimeLockedContrast
    name: contrast_p3b
    tmin: 0.996                               # EXACT icm_next parameter
    tmax: 1.196                               # EXACT icm_next parameter
    condition_a: ["LSGD", "LDGD"]             # Global Different (deviant)
    condition_b: ["LSGS", "LDGS"]             # Global Same (standard)
    roi_aggregation_method: ["trim_mean80"]
    trial_aggregation_method: ["mean"]
    on: EEG 