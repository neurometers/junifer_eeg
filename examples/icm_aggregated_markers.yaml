---
# ICM 34 Validated NICE Markers Configuration
# Updated with correct ROI filtering and aggregation parameters matching NICE

with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: ICMLGDataGrabber
  patterns:
    EEG:
      pattern: "sub-PA301/eeg_raw/sub-PA301_ses-01_task-lg_acq-01_run-01_eeg.mff"
      space: "native"
  replacements: []
  types:
    - EEG
  datadir: "/home/gio/Documents/Repos/junifer_eeg/site/bckp/ground_truth"

preprocess:
  - kind: ICMEquipmentFilter
    equipment_type: "egi"
    dump_location: examples
    dump_granularity: full
    on: EEG
  - kind: ICMLGEpoching
    tmin: -0.2
    tmax: 1.34
    baseline: [-0.2, 0.0]
    event_id:
      "HSTD": 10  
      "HDVT": 20  
      "LSGS": 30  
      "LSGD": 40  
      "LDGD": 50  
      "LDGS": 60  
    dump_location: examples
    dump_granularity: full
    on: EEG
  - kind: ICMAdaptiveArtifactRejection
    zscore_thresh: 4.0
    min_channels: 0.5
    min_events: 0.1
    dump_location: examples
    dump_granularity: full
    on: EEG

storage:
  kind: HDF5FeatureStorage
  uri: icm_34_validated_markers.h5
  single_output: true

markers:
  # ========================================
  # SPECTRAL MARKERS (11 total)
  # ========================================
  
  # Non-normalized spectral power (5 markers: #1-5)
  - kind: SpectralPower
    name: delta_spectralpower
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 4.0
    normalize: false
    dB: true
    db_threshold: 1.0e-12
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    rois: ["scalp"]
    channel_aggregation_method: "mean"
    trial_aggregation_method: "trim_mean80"
    on: EEG

  - kind: SpectralPower
    name: theta_spectralpower
    tmin: null
    tmax: 0.6
    fmin: 4.0
    fmax: 8.0
    normalize: false
    dB: true
    db_threshold: 1.0e-12
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    rois: ["scalp"]
    channel_aggregation_method: "mean"
    trial_aggregation_method: "trim_mean80"
    on: EEG

  - kind: SpectralPower
    name: alpha_spectralpower
    tmin: null
    tmax: 0.6
    fmin: 8.0
    fmax: 12.0
    normalize: false
    dB: true
    db_threshold: 1.0e-12
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    rois: ["scalp"]
    channel_aggregation_method: "mean"
    trial_aggregation_method: "trim_mean80"
    on: EEG

  - kind: SpectralPower
    name: beta_spectralpower
    tmin: null
    tmax: 0.6
    fmin: 12.0
    fmax: 30.0
    normalize: false
    dB: true
    db_threshold: 1.0e-12
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    rois: ["scalp"]
    channel_aggregation_method: "mean"
    trial_aggregation_method: "trim_mean80"
    on: EEG

  - kind: SpectralPower
    name: gamma_spectralpower
    tmin: null
    tmax: 0.6
    fmin: 30.0
    fmax: 45.0
    normalize: false
    dB: true
    db_threshold: 1.0e-12
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    rois: ["scalp"]
    channel_aggregation_method: "mean"
    trial_aggregation_method: "trim_mean80"
    on: EEG

  # Normalized spectral power (5 markers: #6-10)
  - kind: SpectralPower
    name: deltan_spectralpower
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 4.0
    normalize: true
    dB: false
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    rois: ["scalp"]
    channel_aggregation_method: "mean"
    trial_aggregation_method: "trim_mean80"
