with:
  - junifer_eeg

elements:
  - demo_element

datagrabber:
  kind: PatternDataGrabber  
  datadir: ../junifer_eeg/tests/test_data
  types:
    - EEG
  patterns:
    EEG:
      pattern: "subject1_eeg.edf"
      space: native
  replacements: []

storage:
  kind: HDF5FeatureStorage
  uri: ../final_demonstration_results.hdf5
  single_output: true

workdir: /tmp/junifer_final_demo

# Demonstrate flexible ROI/trial aggregation across all implemented markers
markers:
  # 1. KolmogorovComplexity - showcase different aggregation patterns
  - name: KC_Frontal_Regions
    kind: KolmogorovComplexity
    rois: [F, FC]  # Frontal and frontocentral
    roi_aggregation_method: [mean, std]
    nbins: 16
    on: EEG

  - name: KC_Individual_Electrodes
    kind: KolmogorovComplexity
    rois: [Cz, Fz, Pz, Oz]  # Key midline electrodes
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean, std]
    epoch_length: 2.0
    overlap: 0.0
    nbins: 16
    on: EEG

  # 2. SpectralPower - different frequency analysis approaches
  - name: SP_All_Bands_ROI
    kind: SpectralPower
    rois: [C, P, O]  # Central, parietal, occipital
    roi_aggregation_method: [mean, std]
    on: EEG

  - name: SP_Temporal_Analysis
    kind: SpectralPower
    rois: [T7, T8]  # Temporal electrodes (using available ones)
    trial_aggregation_method: [mean, std]
    epoch_length: 1.5
    overlap: 0.25
    on: EEG

  # 3. PermutationEntropy - complexity analysis
  - name: PE_Brain_Regions
    kind: PermutationEntropy
    rois: [F, C, P, T, O]  # All major brain regions
    roi_aggregation_method: [mean]
    kernel: 3
    tau: 5
    on: EEG

  - name: PE_High_Resolution
    kind: PermutationEntropy
    rois: [Fp1, Fp2, F3, F4, C3, C4, P3, P4, O1, O2]  # Bilateral sampling
    roi_aggregation_method: [mean, std]
    trial_aggregation_method: [mean]
    epoch_length: 1.0
    overlap: 0.0
    kernel: 4
    tau: 8
    on: EEG

  # 4. ContingentNegativeVariation - ERP analysis
  - name: CNV_Central_Focus
    kind: ContingentNegativeVariation
    rois: [Cz, C1, C2, FCz]  # Central focus for CNV
    roi_aggregation_method: [mean]
    on: EEG

  - name: CNV_Temporal_Dynamics
    kind: ContingentNegativeVariation
    rois: [F, C]  # Frontal-central axis
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean, std]
    epoch_length: 2.5
    overlap: 0.1
    on: EEG

  # 5. PowerSpectralDensitySummary - frequency summary
  - name: PSD_Alpha_Focus
    kind: PowerSpectralDensitySummary
    rois: [P, O]  # Posterior regions for alpha
    roi_aggregation_method: [mean, std]
    percentile: 75
    fmin: 8
    fmax: 13
    on: EEG

  - name: PSD_Broad_Spectrum
    kind: PowerSpectralDensitySummary
    rois: [Cz, C3, C4, Pz, P3, P4]  # Central-parietal sampling
    roi_aggregation_method: [mean]
    trial_aggregation_method: [mean, std]
    epoch_length: 2.0
    overlap: 0.0
    percentile: 50
    fmin: 1
    fmax: 40
    on: EEG 