---


with:
  - "junifer_eeg"

workdir: "."

datagrabber:
  kind: EEGDataGrabber
  patterns:
    EEG:
      pattern: "{subject}/epochs/{subject}_ses-{session}_task-{task}_acq-{acq}_epo.fif"
      space: "native"
  replacements: ["subject", "session", "task", "acq"]
  types:
    - EEG
  datadir: "/home/gio/Documents/Repos/junifer_eeg/site/bckp/ground_truth"

preprocess: []

storage:
  kind: BIDSFeatureStorage
  uri: output/spectral.h5
  suffix: features
  single_output: false
  output_pickle: true
  delete_h5_after_pickle: false

markers:

  # ========================================
  # 1. SPECTRAL POWER - NON-NORMALIZED (5 bands in 1 marker!)
  # ========================================
  
  - kind: SpectralPowerBands
    name: spectral_power_db
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 30.0]
      gamma: [30.0, 45.0]
    normalize: false
    dB: true
    db_threshold: 1.0e-12
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_method: null
    trial_method: null
    on: EEG

  # ========================================
  # 2. SPECTRAL POWER - NORMALIZED (5 bands + broadband in 1 marker!)
  # ========================================
  
  - kind: SpectralPowerBands
    name: spectral_power_normalized
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 30.0]
      gamma: [30.0, 45.0]
      broadband: [1.0, 45.0]
    normalize: true
    dB: false
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_method: null
    trial_method: null
    on: EEG

  # ========================================
  # 3. PSD SUMMARY MARKERS (3 total)
  # ========================================
  
  - kind: PowerSpectralDensitySummary
    name: per_channel_msf
    percentile: 0.5
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 45.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_method: null
    trial_method: null
    on: EEG

  - kind: PowerSpectralDensitySummary
    name: sef90
    percentile: 0.9
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 45.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_method: null
    trial_method: null
    on: EEG

  - kind: PowerSpectralDensitySummary
    name: sef95
    percentile: 0.95
    tmin: null
    tmax: 0.6
    fmin: 1.0
    fmax: 45.0
    n_fft: 4096
    n_overlap: 100
    n_per_seg: 128
    channel_method: null
    trial_method: null
    on: EEG
