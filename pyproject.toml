[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "junifer-eeg"
version = "0.1.0"
description = "JUnifer EEG - EEG extension for the JUelich NeuroImaging FEature extractoR"
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Giovanni Marraffini", email = "giovanni.marraffini@gmail.com"},
    {name = "Federico Raimondo", email = "fraimondo@proton.me"},
]
keywords = ["eeg", "electrophysiology", "biomarkers", "junifer", "neuroimaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.8"
dependencies = [
    "junifer>=0.0.4",
    "mne>=1.6.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/neurometers/junifer_eeg"
Repository = "https://github.com/neurometers/junifer_eeg"
Documentation = "https://github.com/neurometers/junifer_eeg#readme"
"Bug Tracker" = "https://github.com/neurometers/junifer_eeg/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["junifer_eeg*"]

[tool.ruff]
target-version = "py38"
line-length = 79

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_version.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["junifer_eeg/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
