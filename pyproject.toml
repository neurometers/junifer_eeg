[build-system]
requires = ["setuptools>=70", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "junifer-eeg"
description = "JUnifer EEG - EEG extension for the JUelich NeuroImaging FEature extractoR"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-only"}
authors = [
    { name = "Giovanni Marraffini", email = "g.marraffini@neurometers.ai" },
    { name = "Fede Raimondo", email = "f.raimondo@fz-juelich.de" },
]
maintainers = [
    { name = "Giovanni Marraffini", email = "g.marraffini@neurometers.ai" },
    { name = "Fede Raimondo", email = "f.raimondo@fz-juelich.de" },
]
keywords = [
    "neuroimaging",
    "eeg",
    "electrophysiology",
    "biomarkers",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Natural Language :: English",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "junifer>=0.0.4",
    "mne>=1.6.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.10.0,<=1.15.0",
    "pandas>=2.0.0,<2.3.0",
    "ruamel.yaml>=0.17,<0.19",
    "h5py>=3.10",
    "tqdm>=4.66.1,<4.67.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/neurometers/junifer_eeg"
Source = "https://github.com/neurometers/junifer_eeg"
Issues = "https://github.com/neurometers/junifer_eeg/issues"

[project.scripts]
junifer-eeg = "junifer_eeg.cli:cli"

[project.optional-dependencies]
all = [
    "neurokit2>=0.1.7",
    "pywavelets>=1.4.0",
    "antropy>=0.1.4",
]
neurokit2 = ["neurokit2>=0.1.7"]
wavelets = ["pywavelets>=1.4.0"]
entropy = ["antropy>=0.1.4"]
dev = [
    "tox",
    "pre-commit",
    "ruff",
    "towncrier",
    "pytest>=7.0",
    "pytest-cov",
]
docs = [
    "sphinx>=7.3.0,<8.1.0",
    "furo>=2024.4.27,<2024.9.0",
    "numpydoc>=1.6.0,<1.9.0",
    "sphinx-copybutton>=0.5.1,<0.5.3",
    "towncrier>=23.10.0,<24.7.0",
    "setuptools-scm>=8",
]

################
# Tool configs #
################

[tool.setuptools]
packages = [
    "junifer_eeg",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "junifer_eeg/_version.py"

[tool.codespell]
skip = "*/auto_examples/*,*.html,.git/,*.pyc,*/_build/*"
count = ""
quiet-level = 3
ignore-words = "ignore_words.txt"
interactive = 0
builtin = "clear,rare,informal,names,usage,code"

[tool.ruff]
line-length = 79
extend-exclude = [
    "__init__.py",
    "__init__.pyi",
    "docs",
    "examples",
    "tools",
    "_version.py",
]
target-version = "py39"

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # flake8-blind-except
    "BLE",
    # flake8-comprehensions
    "C4",
    # mccabe
    "C90",
    # pydocstyle
    "D",
    # pycodestyle errors
    "E",
    # pyflakes
    "F",
    # isort
    "I",
    # pep8-naming
    "N",
    # pygrep-hooks
    "PGH",
    # ruff
    "RUF",
    # flake8-type-checking
    "TCH",
    # pyupgrade
    "UP",
    # pycodestyle warnings
    "W",
    # flake8-2020
    "YTT",
]
ignore = [
    # Use of `functools.lru_cache` or `functools.cache` on methods can lead to
    # memory leaks. The cache may retain instance references, preventing garbage
    # collection.
    "B019",
    # abstract class with no abstract methods
    "B024",
    "D202",
    # missing docstring in __init__, incompatible with numpydoc
    "D107",
    # use r""" if any backslashes in a docstring
    "D301",
    # class names should use CapWords convention
    "N801",
    # function name should be lowercase
    "N802",
    # variable in function should be lowercase
    "N806",
    # use specific rule codes when ignoring type issues
    "PGH003",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["junifer_eeg"]
known-third-party = [
    "junifer",
    "mne",
    "numpy",
    "scipy",
    "pandas",
    "yaml",
    "tqdm",
    "neurokit2",
    "pytest",
    "pywt",
    "antropy",
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = "junifer_eeg"
log_cli_level = "INFO"
xfail_strict = true
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "-vv",
]

[tool.towncrier]
directory = "docs/changes/newsfragments"
filename = "docs/whats_new.rst"
package = "junifer_eeg"
# to use gh_substitutions
issue_format = ":gh:`{issue}`"
# modify to have proper toctree
underlines = "-^~"
# set line length to 79
wrap = true

# Need to put default explicitly as custom is not combined with default

[tool.towncrier.fragment.bugfix]
name = "Bugfixes"
showcontent = true

[tool.towncrier.fragment.doc]
name = "Improved Documentation"
showcontent = true

[tool.towncrier.fragment.feature]
name = "Features"
showcontent = true

[tool.towncrier.fragment.misc]
name = "Miscellaneous"
showcontent = true

[tool.towncrier.fragment.removal]
name = "Deprecations and Removals"
showcontent = true

# Add custom towncrier fragment for enhancements
[tool.towncrier.fragment.enh]
name = "Enhancements"
showcontent = true

# Add custom towncrier fragment for API changes
[tool.towncrier.fragment.change]
name = "API Changes"
showcontent = true

[tool.coverage.paths]
source = [
    "junifer_eeg",
    "*/site-packages/junifer_eeg",
]

[tool.coverage.run]
branch = true
omit = [
    "*/setup.py",
    "*/_version.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Type checking if statements should not be considered
    "if TYPE_CHECKING:",
    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
]
precision = 2
